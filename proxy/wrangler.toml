name = "devforge-proxy"
main = "src/index.js"
compatibility_date = "2025-09-01"

# Generic config for local development (`npm run dev`). No real domain is committed.
# For production, copy this file to wrangler.production.toml (gitignored), add your route, then `npm run deploy`:
#
#   routes = [
#     { pattern = "tools.example.com/api/*", zone_name = "example.com" }
#   ]
#   ALLOWED_ORIGINS = "https://tools.example.com"

[vars]
# Browser origins allowed to call the proxy (others get 403). Requests without an Origin header (same-origin GETs) are allowed.
ALLOWED_ORIGINS = "http://localhost:3123,http://localhost:3000,http://localhost:3130"
# Extra domains the proxy must never scan, comma-separated. The host the Worker is served from
# and its parent domain are always blocked automatically.
BLOCKED_DOMAINS = ""

# 30 requests per minute per visitor IP
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 30
  period = 60
